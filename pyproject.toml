    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "transformers>=4.20.0",
    "datasets>=2.0.0",
    "diffusers>=0.20.0",
    "timm>=0.9.0",
    "matplotlib>=3.5.0",
